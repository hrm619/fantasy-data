[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
fantasy-pipeline = { path = "../fantasy_data_pipeline", editable = true }

[project]
name = "fantasy-data"
version = "0.1.0"
description = "Fantasy football data model, ETL, and edge identification — the canonical data store in quant-edge, a local fantasy-football research system"
readme = "README.md"
authors = [
    {name = "Henry Marsh"},
]
requires-python = ">=3.13"
dependencies = [
    "fantasy-pipeline",
    "sqlalchemy>=2.0.0",
    "click>=8.1.0",
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
    "nfl_data_py>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Pre-1.0 and still tightening: 0.0.63 rejects sort keys that 0.0.49 accepted. A RANGE DOES NOT
    # PIN THIS — `uv.lock` does, and CI must install from it (see .github/workflows/ci.yml). While CI
    # ran `uv pip install`, which ignores the lock, it silently resolved a newer ty than every local
    # `.venv` and failed on diagnostics no one could reproduce. The floor tracks the locked version so
    # a lock-less install can't land *older* than what the code is verified against; upgrade with
    # `uv lock --upgrade-package ty`, which makes the bump a reviewable diff.
    "ty>=0.0.63,<0.1",
    "pre-commit>=3.0.0",
]
viz = [
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
    "scipy>=1.11.0",
]
# Browser automation for `scripts/fetch_rp.py` (Reception Perception exports). Deliberately
# optional: nothing in src/ imports it, so the installed package never needs a browser. CI does
# install this extra — not to drive a browser, but because `ty check scripts/` must resolve the
# playwright import; the wheel alone satisfies that, and browsers only arrive via
# `playwright install`, which CI never runs.
# Session/auth is reused from fantasy_pipeline.scraper.auth — see ../RP_SOURCE_PLAN.md §5.1.
# Pinned to the same minor as fantasy_data_pipeline's 'headless' extra so both repos drive the
# same cached Chromium build. Unpinned, uv resolves a newer Playwright here that demands a
# browser revision the shared ~/Library/Caches/ms-playwright doesn't have, forcing a redundant
# ~150MB download and leaving two repos automating the same site on different engines.
scrape = [
    "playwright>=1.60.0,<1.61.0",
]

[project.scripts]
fantasy-data = "fantasy_data.cli:cli"

[project.urls]
Repository = "https://github.com/hrm619/fantasy-data"

[tool.pytest.ini_options]
# `integration` tests read the gitignored data-dev/ captures and skip when absent, so a plain
# `pytest` run stays hermetic. Run them explicitly with `-m integration`.
markers = [
    "integration: requires local data-dev/ captures (skipped when they are not present)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Pyflakes (F) plus the pycodestyle subset ruff enables by default.
# E501 (line-too-long) is intentionally omitted — several data/regex lines are long by design.
select = ["E4", "E7", "E9", "F"]

# Formatting handled by `ruff format` (black-compatible drop-in). line-length is
# inherited from [tool.ruff] above, so no separate formatter config is needed.

[tool.ty]
# Astral's type checker (Rust), replacing mypy. Run with `uv run ty check src/ scripts/ tests/`.
# All three dirs are clean and gated in CI — ORM models use SQLAlchemy 2.0 Mapped[]
# typing so attribute assignments type-check. Keep `ty check` green when adding code.
