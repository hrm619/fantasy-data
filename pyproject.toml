[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
fantasy-pipeline = { path = "../fantasy_data_pipeline", editable = true }

[project]
name = "fantasy-data"
version = "0.1.0"
description = "Fantasy football data model, ETL, and edge identification for the quant-edge platform"
readme = "README.md"
authors = [
    {name = "Henry Marsh"},
]
requires-python = ">=3.13"
dependencies = [
    "fantasy-pipeline",
    "sqlalchemy>=2.0.0",
    "click>=8.1.0",
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
    "nfl_data_py>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ty>=0.0.49,<0.1",  # pre-1.0: pin to a compatible range so a stricter release can't break CI unexpectedly
    "pre-commit>=3.0.0",
]
viz = [
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
    "scipy>=1.11.0",
]

[project.scripts]
fantasy-data = "fantasy_data.cli:cli"

[project.urls]
Repository = "https://github.com/henrymarsh/fantasy-data"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Pyflakes (F) plus the pycodestyle subset ruff enables by default.
# E501 (line-too-long) is intentionally omitted — several data/regex lines are long by design.
select = ["E4", "E7", "E9", "F"]

# Formatting handled by `ruff format` (black-compatible drop-in). line-length is
# inherited from [tool.ruff] above, so no separate formatter config is needed.

[tool.ty]
# Astral's type checker (Rust), replacing mypy. Run with `uv run ty check src/ scripts/ tests/`.
# All three dirs are clean and gated in CI — ORM models use SQLAlchemy 2.0 Mapped[]
# typing so attribute assignments type-check. Keep `ty check` green when adding code.
