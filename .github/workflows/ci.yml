name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    # All `run:` steps execute from the fantasy-data checkout. fantasy-data depends
    # on fantasy_data_pipeline as an editable sibling (`../fantasy_data_pipeline` in
    # pyproject), so both repos are checked out side by side under the workspace.
    defaults:
      run:
        working-directory: fantasy-data

    steps:
      - name: Check out fantasy-data
        uses: actions/checkout@v4
        with:
          path: fantasy-data

      - name: Check out fantasy_data_pipeline (editable sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: hrm619/fantasy_data_pipeline
          path: fantasy_data_pipeline

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev + viz dependencies
        # setup-uv already provisions the Python + virtual environment.
        # The viz extra (plotly/scipy/kaleido) is included so tests/test_viz.py runs.
        run: uv pip install -e ".[dev,viz]"

      - name: Lint (ruff)
        run: uv run ruff check src/ scripts/ tests/

      - name: Format check (ruff format)
        run: uv run ruff format --check src/ scripts/ tests/

      - name: Type check (ty)
        run: uv run ty check src/ scripts/ tests/

      - name: Test (pytest)
        run: uv run pytest
